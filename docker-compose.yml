services:
  postgres:
    image: postgres:16
    container_name: sbr-postgres
    # Without this the datastores stay down after any Docker/host restart while
    # the apps (run under tmux, outside compose) keep going — and the freed
    # 5432/6379 can then be claimed by any other Postgres/Redis on the box, so
    # perfectly valid credentials start being rejected. See the note in README.
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbrbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Loopback only. `"5432:5432"` publishes to 0.0.0.0 — with the development
    # credentials below that is an open Postgres on the internet, which is
    # scanned for and taken over within hours. The apps run on the same host, so
    # they lose nothing; a remote client should tunnel over SSH.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sbrbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sbr-redis
    restart: unless-stopped
    # Loopback only, and for the stronger reason: this Redis has no password at
    # all, and an exposed one is routinely used to write an SSH key onto the host.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
